{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet"/>
    </head>
    <body class="bg-white text-gray-800 min-h-screen">
        <header class="w-full bg-white shadow flex items-center justify-between px-6 py-4 fixed top-0 left-0 right-0 z-40">
            <a href="{% url 'events' %}" 
                        class="px-3 py-2 border-2 border-black rounded-lg text-xl hover:bg-black hover:text-white">
                            ← 
                        </a>
            <h1 class="text-2xl font-bold text-blue-800">CampusHub</h1>
        </header>
        <div class="max-w-3xl mx-auto p-6 bg-white shadow rounded-lg">

            <h2 class="text-2xl font-semibold mb-6 text-center">
                Request New Event
            </h2>

            <form method="post" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}

                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium mb-1">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-600 text-sm">
                                {{ field.errors|striptags }}
                            </p>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit"
                        class="w-full bg-blue-700 text-white py-2 rounded-lg hover:bg-blue-800 transition">
                    Submit Event Request
                </button>
            </form>

        </div>
    </body>
</html>
